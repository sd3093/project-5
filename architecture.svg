<svg width="100%" viewBox="0 0 680 695" xmlns="http://www.w3.org/2000/svg">
<title>RAG Architecture — Document Q&amp;A System</title>
<desc>Two-phase pipeline: ingestion loads policy documents through SimpleDirectoryReader, SentenceSplitter, and HuggingFace embeddings into VectorStoreIndex; query phase embeds user questions, performs cosine similarity search, then generates answers via Google Gemini with retrieved context</desc>

<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; opacity: 0.7; }
  .arr { stroke: #888; stroke-width: 1.5; }
  .leader { stroke: #aaa; stroke-width: 0.5; stroke-dasharray: 4 3; }

  /* Light mode (default) */
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #0C447C; }
  .c-blue .ts { fill: #185FA5; }

  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #633806; }
  .c-amber .ts { fill: #854F0B; }

  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }

  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0F6E56; }

  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #712B13; }
  .c-coral .ts { fill: #993C1D; }

  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th { fill: #27500A; }
  .c-green .ts { fill: #3B6D11; }

  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }

  @media (prefers-color-scheme: dark) {
    text { fill: #ccc; }
    .ts { fill: #999; }
    .arr { stroke: #777; }
    .leader { stroke: #666; }

    .c-blue rect { fill: #0C447C; stroke: #85B7EB; }
    .c-blue .th { fill: #B5D4F4; }
    .c-blue .ts { fill: #85B7EB; }

    .c-amber rect { fill: #633806; stroke: #FAC775; }
    .c-amber .th { fill: #FAEEDA; }
    .c-amber .ts { fill: #FAC775; }

    .c-purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple .th { fill: #CECBF6; }
    .c-purple .ts { fill: #AFA9EC; }

    .c-teal rect { fill: #085041; stroke: #5DCAA5; }
    .c-teal .th { fill: #9FE1CB; }
    .c-teal .ts { fill: #5DCAA5; }

    .c-coral rect { fill: #712B13; stroke: #F0997B; }
    .c-coral .th { fill: #F5C4B3; }
    .c-coral .ts { fill: #F0997B; }

    .c-green rect { fill: #27500A; stroke: #97C459; }
    .c-green .th { fill: #C0DD97; }
    .c-green .ts { fill: #97C459; }

    .c-gray rect { fill: #444441; stroke: #B4B2A9; }
    .c-gray .th { fill: #D3D1C7; }
    .c-gray .ts { fill: #B4B2A9; }
  }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- === DOCUMENTS === -->
<g class="c-blue">
  <rect x="60" y="20" width="250" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="185" y="38" text-anchor="middle" dominant-baseline="central">6 policy documents</text>
  <text class="ts" x="185" y="56" text-anchor="middle" dominant-baseline="central">.txt files in data/policies/</text>
</g>

<line x1="185" y1="72" x2="185" y2="102" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="55" y="96">Ingestion pipeline</text>

<!-- SimpleDirectoryReader -->
<g class="c-amber">
  <rect x="55" y="104" width="260" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="185" y="126" text-anchor="middle" dominant-baseline="central">SimpleDirectoryReader</text>
</g>
<line x1="185" y1="148" x2="185" y2="170" class="arr" marker-end="url(#arrow)"/>

<!-- SentenceSplitter -->
<g class="c-amber">
  <rect x="44" y="170" width="282" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="185" y="186" text-anchor="middle" dominant-baseline="central">SentenceSplitter</text>
  <text class="ts" x="185" y="206" text-anchor="middle" dominant-baseline="central">chunk_size=512, overlap=50</text>
</g>
<line x1="185" y1="222" x2="185" y2="246" class="arr" marker-end="url(#arrow)"/>

<!-- HuggingFace Embedding -->
<g class="c-amber">
  <rect x="30" y="246" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="185" y="262" text-anchor="middle" dominant-baseline="central">HuggingFace embedding</text>
  <text class="ts" x="185" y="282" text-anchor="middle" dominant-baseline="central">bge-small-en-v1.5 → 384-dim vectors</text>
</g>
<line x1="185" y1="298" x2="185" y2="324" class="arr" marker-end="url(#arrow)"/>

<!-- VectorStoreIndex -->
<g class="c-purple">
  <rect x="50" y="324" width="270" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="185" y="340" text-anchor="middle" dominant-baseline="central">VectorStoreIndex</text>
  <text class="ts" x="185" y="360" text-anchor="middle" dominant-baseline="central">In-memory vector store</text>
</g>

<!-- === QUERY PIPELINE === -->
<text class="ts" x="400" y="160">Query pipeline</text>

<g class="c-gray">
  <rect x="400" y="170" width="180" height="40" rx="8" stroke-width="0.5"/>
  <text class="th" x="490" y="190" text-anchor="middle" dominant-baseline="central">User question</text>
</g>
<line x1="490" y1="210" x2="490" y2="246" class="arr" marker-end="url(#arrow)"/>

<!-- Embed Query -->
<g class="c-teal">
  <rect x="395" y="246" width="190" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="490" y="262" text-anchor="middle" dominant-baseline="central">Embed query</text>
  <text class="ts" x="490" y="282" text-anchor="middle" dominant-baseline="central">Same embedding model</text>
</g>
<line class="leader" x1="342" y1="272" x2="393" y2="272"/>
<line x1="490" y1="298" x2="490" y2="324" class="arr" marker-end="url(#arrow)"/>

<!-- Similarity Search -->
<g class="c-teal">
  <rect x="388" y="324" width="200" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="488" y="340" text-anchor="middle" dominant-baseline="central">Similarity search</text>
  <text class="ts" x="488" y="360" text-anchor="middle" dominant-baseline="central">Cosine sim, top-3 chunks</text>
</g>

<!-- VectorStore → Similarity Search -->
<line x1="322" y1="350" x2="386" y2="350" class="arr" marker-end="url(#arrow)"/>

<!-- === GENERATION === -->
<path d="M488 376 L488 396 L405 396 L405 420" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M400 190 L365 190 L365 420" fill="none" class="leader" marker-end="url(#arrow)"/>

<!-- Prompt Template -->
<g class="c-coral">
  <rect x="210" y="422" width="260" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="438" text-anchor="middle" dominant-baseline="central">Prompt template</text>
  <text class="ts" x="340" y="458" text-anchor="middle" dominant-baseline="central">Context + question</text>
</g>
<line x1="340" y1="474" x2="340" y2="498" class="arr" marker-end="url(#arrow)"/>

<!-- Google Gemini -->
<g class="c-coral">
  <rect x="220" y="498" width="240" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="514" text-anchor="middle" dominant-baseline="central">Google Gemini</text>
  <text class="ts" x="340" y="534" text-anchor="middle" dominant-baseline="central">gemini-2.0-flash</text>
</g>
<line x1="340" y1="550" x2="340" y2="574" class="arr" marker-end="url(#arrow)"/>

<!-- Answer + Citations -->
<g class="c-green">
  <rect x="240" y="574" width="200" height="40" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="594" text-anchor="middle" dominant-baseline="central">Answer + citations</text>
</g>
<line x1="340" y1="614" x2="340" y2="638" class="arr" marker-end="url(#arrow)"/>

<!-- Streamlit Chat UI -->
<g class="c-green">
  <rect x="240" y="638" width="200" height="40" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="658" text-anchor="middle" dominant-baseline="central">Streamlit chat UI</text>
</g>

</svg>
